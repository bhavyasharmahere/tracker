<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Daily Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        rRed: '#EF4444',
                        rOrange: '#F97316',
                        rYellow: '#EAB308',
                        rBlue: '#3B82F6',
                        rGreen: '#22C55E',
                        rPink: '#F472B6'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 35%, #31103f 70%, #0f172a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-shell {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-tile {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-tile:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Full tile color overrides when selected */
        .tile-rated-1 { background: rgba(239, 68, 68, 0.25) !important; border-color: rgba(239, 68, 68, 0.6) !important; }
        .tile-rated-2 { background: rgba(249, 115, 22, 0.25) !important; border-color: rgba(249, 115, 22, 0.6) !important; }
        .tile-rated-3 { background: rgba(234, 179, 8, 0.25) !important; border-color: rgba(234, 179, 8, 0.6) !important; }
        .tile-rated-4 { background: rgba(59, 130, 246, 0.25) !important; border-color: rgba(59, 130, 246, 0.6) !important; }
        .tile-rated-5 { background: rgba(34, 197, 94, 0.25) !important; border-color: rgba(34, 197, 94, 0.6) !important; }

        .rating-box {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            transition: all 0.15s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0.4;
        }

        .rating-box:hover:not(.disabled) {
            opacity: 0.9;
            transform: scale(1.15);
        }

        .rating-box.selected {
            opacity: 1;
            transform: scale(1.2);
            box-shadow: 0 0 10px currentColor;
            border-color: #ffffff;
        }

        .rating-box.disabled {
            cursor: not-allowed;
            opacity: 0.15;
        }

        /* Unmarked Missed Day Styling */
        .day-missed {
            background: rgba(244, 114, 182, 0.12) !important;
            border-color: rgba(244, 114, 182, 0.35) !important;
        }

        /* Github Map Block */
        .gh-block {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            transition: transform 0.2s ease;
        }
        .gh-block:hover {
            transform: scale(1.3);
        }
    </style>
</head>
<body class="font-sans text-slate-100 p-4 sm:p-8 selection:bg-rose-500 selection:text-white relative min-h-screen">

    <!-- Dynamic Refreshable Background Layer -->
    <div id="bg-layer" class="fixed inset-0 bg-cover bg-center bg-no-repeat transition-all duration-700 -z-20 scale-105" style="background-image: url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1920&q=80');"></div>
    <div class="fixed inset-0 bg-slate-950/75 backdrop-blur-md -z-10"></div>

    <div class="max-w-4xl mx-auto space-y-6 relative z-10">

        <!-- Top Header & Navigation -->
        <header class="glass-shell rounded-3xl p-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-2xl">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                    Daily Rhythm
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">Tactile Month Tracker • Rating Window 4:00 PM – 11:30 PM</p>
            </div>

            <!-- Controls: Wallpaper Refresh & Month Navigation -->
            <div class="flex items-center gap-3">
                <button id="btn-refresh-bg" title="Refresh Wallpaper" class="flex items-center gap-1.5 px-3 py-1.5 bg-white/10 hover:bg-white/20 active:scale-95 text-xs font-semibold rounded-2xl border border-white/15 transition-all">
                    <i class="fa-solid fa-arrows-rotate text-[11px]"></i>
                    <span class="hidden sm:inline">Refresh BG</span>
                </button>

                <div class="flex items-center gap-3 bg-white/5 px-3 py-1.5 rounded-2xl border border-white/10">
                    <button id="btn-prev" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <span id="current-month-display" class="text-sm font-semibold text-white min-w-[120px] text-center select-none">
                        ---
                    </span>
                    <button id="btn-next" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- GitHub Style Calendar Contribution Heatmap -->
        <section class="glass-shell rounded-3xl p-5 space-y-3">
            <div class="flex items-center justify-between text-xs font-semibold text-slate-400">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-border-all text-[10px]"></i> GitHub-Style Month Heatmap</span>
                <span id="heatmap-completion-text" class="text-slate-300">0% Completed</span>
            </div>
            <div id="github-heatmap" class="flex flex-wrap gap-1.5 p-3 bg-black/20 rounded-2xl border border-white/5 justify-start">
                <!-- Dynamic GitHub blocks -->
            </div>
        </section>

        <!-- Legend Bar (Inverted Colors: Red=1, Orange=2, Yellow=3, Blue=4, Green=5) -->
        <section class="glass-shell rounded-2xl px-6 py-3 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex flex-wrap items-center gap-4 text-slate-300 font-medium">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-rRed"></span> 1★ Red</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-rOrange"></span> 2★ Orange</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-rYellow"></span> 3★ Yellow</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-rBlue"></span> 4★ Blue</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-rGreen"></span> 5★ Green</span>
                <span class="flex items-center gap-1.5 border-l border-white/10 pl-3"><span class="w-3 h-3 rounded-sm bg-rPink"></span> Missed</span>
            </div>
            <div id="live-time-status" class="text-[11px] font-semibold text-slate-400 bg-white/5 px-2.5 py-1 rounded-full border border-white/10">
                <i class="fa-regular fa-clock mr-1"></i> <span id="clock-text">--:--</span>
            </div>
        </section>

        <!-- Month Summary Stats -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="glass-shell rounded-2xl p-4">
                <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Month Average</span>
                <div class="text-2xl font-bold text-white mt-1" id="stat-month-avg">0.0</div>
            </div>
            <div class="glass-shell rounded-2xl p-4">
                <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Logged Days</span>
                <div class="text-2xl font-bold text-emerald-400 mt-1" id="stat-logged-count">0</div>
            </div>
            <div class="glass-shell rounded-2xl p-4">
                <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Missed Days</span>
                <div class="text-2xl font-bold text-rose-400 mt-1" id="stat-missed-count">0</div>
            </div>
            <div class="glass-shell rounded-2xl p-4">
                <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Current Window</span>
                <div class="text-xs font-semibold mt-2.5" id="stat-window-status">
                    Checking...
                </div>
            </div>
        </section>

        <!-- Weekly Groups Container -->
        <main id="weeks-wrapper" class="space-y-4">
            <!-- Weekly Cards & Day Rows will render dynamically -->
        </main>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 opacity-0 translate-y-4 transition-all duration-300 pointer-events-none glass-shell bg-slate-900/90 rounded-2xl px-4 py-2.5 text-xs font-semibold text-white shadow-2xl flex items-center gap-2 border border-white/20">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="toast-text">Data updated</span>
    </div>

    <script>
        // Inverted Rating Scale: 1 Star = Red, 2 Stars = Orange, 3 Stars = Yellow, 4 Stars = Blue, 5 Stars = Green
        const RATINGS = [
            { stars: 1, colorClass: 'bg-rRed', name: '1 Star (Red)' },
            { stars: 2, colorClass: 'bg-rOrange', name: '2 Stars (Orange)' },
            { stars: 3, colorClass: 'bg-rYellow', name: '3 Stars (Yellow)' },
            { stars: 4, colorClass: 'bg-rBlue', name: '4 Stars (Blue)' },
            { stars: 5, colorClass: 'bg-rGreen', name: '5 Stars (Green)' }
        ];

        const MONTH_NAMES = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        // State
        let now = new Date();
        let activeYear = now.getFullYear();
        let activeMonth = now.getMonth();
        let ratingsStore = {}; 

        // DOM Elements
        const currentMonthDisplay = document.getElementById('current-month-display');
        const weeksWrapper = document.getElementById('weeks-wrapper');
        const githubHeatmap = document.getElementById('github-heatmap');
        const heatmapCompletionText = document.getElementById('heatmap-completion-text');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const clockText = document.getElementById('clock-text');
        const statWindowStatus = document.getElementById('stat-window-status');

        window.onload = () => {
            loadStore();
            setupEvents();
            startClock();
            setupBackgroundFetcher();
            render();
        };

        function setupBackgroundFetcher() {
            const bgLayer = document.getElementById('bg-layer');
            const btnRefreshBg = document.getElementById('btn-refresh-bg');

            const fetchNewBg = () => {
                // Fetch high quality minimal/nature wallpapers from Unsplash Source URL with timestamp to prevent caching
                const newUrl = `https://picsum.photos/1920/1080?random=${Date.now()}`;
                
                // Preload image before switching for smooth visual transition
                const img = new Image();
                img.src = newUrl;
                img.onload = () => {
                    bgLayer.style.backgroundImage = `url('${newUrl}')`;
                    triggerToast('Wallpaper Refreshed');
                };
            };

            btnRefreshBg.addEventListener('click', fetchNewBg);
        }

        function loadStore() {
            try {
                const stored = localStorage.getItem('rhythm_ratings_store_v2');
                if (stored) ratingsStore = JSON.parse(stored);
            } catch (e) {
                console.error("Failed to load ratings store", e);
            }
        }

        function saveStore() {
            try {
                localStorage.setItem('rhythm_ratings_store_v2', JSON.stringify(ratingsStore));
                triggerToast('Saved');
            } catch (e) {
                console.error("Failed to save ratings store", e);
            }
        }

        function setupEvents() {
            btnPrev.addEventListener('click', () => {
                if (activeMonth === 0) {
                    activeMonth = 11;
                    activeYear--;
                } else {
                    activeMonth--;
                }
                render();
            });

            btnNext.addEventListener('click', () => {
                if (activeMonth === 11) {
                    activeMonth = 0;
                    activeYear++;
                } else {
                    activeMonth++;
                }
                render();
            });
        }

        function startClock() {
            const updateTime = () => {
                now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const mins = String(now.getMinutes()).padStart(2, '0');
                clockText.textContent = `${hours}:${mins}`;
                updateWindowStatus();
            };
            updateTime();
            setInterval(updateTime, 10000); 
        }

        function isWithinRatingWindow() {
            const currentHour = now.getHours();
            const currentMin = now.getMinutes();
            const totalMins = currentHour * 60 + currentMin;
            
            const startMins = 16 * 60; // 4:00 PM
            const endMins = 23 * 60 + 30; // 11:30 PM

            return totalMins >= startMins && totalMins <= endMins;
        }

        function updateWindowStatus() {
            if (isWithinRatingWindow()) {
                statWindowStatus.innerHTML = `<span class="text-emerald-400 font-bold"><i class="fa-solid fa-lock-open mr-1"></i> Open (4PM-11:30PM)</span>`;
            } else {
                statWindowStatus.innerHTML = `<span class="text-amber-400 font-bold"><i class="fa-solid fa-lock mr-1"></i> Closed (Opens 4PM)</span>`;
            }
        }

        function render() {
            currentMonthDisplay.textContent = `${MONTH_NAMES[activeMonth]} ${activeYear}`;
            weeksWrapper.innerHTML = '';
            githubHeatmap.innerHTML = '';

            const daysInMonth = new Date(activeYear, activeMonth + 1, 0).getDate();
            const realTodayStr = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());

            // Render GitHub Heatmap Blocks
            let heatmapLogged = 0;
            for (let d = 1; d <= daysInMonth; d++) {
                const dateKey = formatDateKey(activeYear, activeMonth, d);
                const dayDate = new Date(activeYear, activeMonth, d);
                const isPast = dayDate < new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const savedRating = ratingsStore[dateKey] || null;

                const ghBlock = document.createElement('div');
                ghBlock.className = 'gh-block';
                ghBlock.title = `${MONTH_NAMES[activeMonth]} ${d}: ${savedRating ? savedRating + ' Stars' : (isPast ? 'Missed' : 'Unrated')}`;

                if (savedRating === 1) ghBlock.className += ' bg-rRed';
                else if (savedRating === 2) ghBlock.className += ' bg-rOrange';
                else if (savedRating === 3) ghBlock.className += ' bg-rYellow';
                else if (savedRating === 4) ghBlock.className += ' bg-rBlue';
                else if (savedRating === 5) ghBlock.className += ' bg-rGreen';
                else if (isPast) ghBlock.className += ' bg-rPink';
                else ghBlock.className += ' bg-white/10';

                if (savedRating) heatmapLogged++;
                githubHeatmap.appendChild(ghBlock);
            }

            const completionPercent = Math.round((heatmapLogged / daysInMonth) * 100);
            heatmapCompletionText.textContent = `${completionPercent}% Month Completed`;

            // Group Days into Weeks
            const weeks = [];
            let currentWeek = [];

            for (let day = 1; day <= daysInMonth; day++) {
                currentWeek.push(day);
                if (currentWeek.length === 7 || day === daysInMonth) {
                    weeks.push([...currentWeek]);
                    currentWeek = [];
                }
            }

            let monthTotalScore = 0;
            let monthLoggedCount = 0;
            let monthMissedCount = 0;

            // Render Each Week Group
            weeks.forEach((weekDays, wIndex) => {
                const weekCard = document.createElement('div');
                weekCard.className = 'glass-shell rounded-3xl p-5 space-y-3';

                let weekScoreSum = 0;
                let weekLoggedCount = 0;

                const weekHeader = document.createElement('div');
                weekHeader.className = 'flex items-center justify-between pb-2 border-b border-white/10 text-xs font-semibold text-slate-400';
                
                const weekTitle = document.createElement('span');
                weekTitle.textContent = `Week ${wIndex + 1} (${weekDays[0]} - ${weekDays[weekDays.length - 1]} ${MONTH_NAMES[activeMonth].slice(0,3)})`;
                
                const weekAvgBadge = document.createElement('span');
                weekAvgBadge.className = 'bg-white/10 px-2.5 py-1 rounded-full border border-white/10 font-bold text-slate-200';

                weekHeader.appendChild(weekTitle);
                weekHeader.appendChild(weekAvgBadge);
                weekCard.appendChild(weekHeader);

                const daysGrid = document.createElement('div');
                daysGrid.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-7 gap-2.5';

                weekDays.forEach(dayNum => {
                    const dateKey = formatDateKey(activeYear, activeMonth, dayNum);
                    const dayDate = new Date(activeYear, activeMonth, dayNum);
                    const dayName = dayDate.toLocaleDateString('en-US', { weekday: 'short' });
                    
                    const isFuture = dayDate > new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const isToday = (dateKey === realTodayStr);
                    const isPast = dayDate < new Date(now.getFullYear(), now.getMonth(), now.getDate());

                    const savedRating = ratingsStore[dateKey] || null;

                    if (savedRating) {
                        weekScoreSum += savedRating;
                        weekLoggedCount++;
                        monthTotalScore += savedRating;
                        monthLoggedCount++;
                    } else if (isPast) {
                        monthMissedCount++;
                    }

                    // Interactive Day Card
                    const dayTile = document.createElement('div');
                    dayTile.className = 'glass-tile rounded-2xl p-3 flex flex-col justify-between space-y-2 relative';

                    if (savedRating) {
                        dayTile.classList.add(`tile-rated-${savedRating}`);
                    } else if (isPast) {
                        dayTile.classList.add('day-missed');
                    }

                    if (isFuture) {
                        dayTile.classList.add('disabled', 'opacity-40');
                    }

                    // Day Tile Header
                    const dayTop = document.createElement('div');
                    dayTop.className = 'flex items-center justify-between';
                    
                    const dateText = document.createElement('span');
                    dateText.className = `text-xs font-bold ${isToday ? 'text-emerald-400' : 'text-slate-200'}`;
                    dateText.textContent = `${dayNum} ${dayName}`;

                    dayTop.appendChild(dateText);

                    if (isToday) {
                        const todayBadge = document.createElement('span');
                        todayBadge.className = 'text-[9px] font-bold uppercase tracking-wider bg-emerald-500 text-slate-950 px-1.5 py-0.5 rounded';
                        todayBadge.textContent = 'Today';
                        dayTop.appendChild(todayBadge);
                    } else if (isPast && !savedRating) {
                        const missedTag = document.createElement('span');
                        missedTag.className = 'text-[9px] font-bold uppercase tracking-wider text-rose-400';
                        missedTag.textContent = 'Missed';
                        dayTop.appendChild(missedTag);
                    }

                    dayTile.appendChild(dayTop);

                    // 5 Color Square Rating Checkboxes
                    const boxesRow = document.createElement('div');
                    boxesRow.className = 'flex items-center justify-between pt-1';

                    const canRate = isPast || (isToday && isWithinRatingWindow());

                    RATINGS.forEach(r => {
                        const box = document.createElement('div');
                        box.className = `rating-box ${r.colorClass}`;
                        
                        if (savedRating === r.stars) {
                            box.classList.add('selected');
                        }

                        if (!canRate) {
                            box.classList.add('disabled');
                        } else {
                            box.title = `${r.name}`;
                            box.addEventListener('click', () => {
                                if (ratingsStore[dateKey] === r.stars) {
                                    delete ratingsStore[dateKey]; // Toggle off
                                } else {
                                    ratingsStore[dateKey] = r.stars;
                                }
                                saveStore();
                                render();
                            });
                        }
                        boxesRow.appendChild(box);
                    });

                    dayTile.appendChild(boxesRow);

                    if (isToday && !isWithinRatingWindow() && !savedRating) {
                        const note = document.createElement('span');
                        note.className = 'text-[9px] text-amber-400 font-semibold block leading-tight';
                        note.textContent = 'Opens 4:00 PM';
                        dayTile.appendChild(note);
                    }

                    daysGrid.appendChild(dayTile);
                });

                weekCard.appendChild(daysGrid);

                const weekAvg = weekLoggedCount > 0 ? (weekScoreSum / weekLoggedCount).toFixed(1) : '—';
                weekAvgBadge.textContent = `W${wIndex + 1} Avg: ${weekAvg}`;

                weeksWrapper.appendChild(weekCard);
            });

            // Update Header Stats
            document.getElementById('stat-logged-count').textContent = monthLoggedCount;
            document.getElementById('stat-missed-count').textContent = monthMissedCount;
            const monthAvg = monthLoggedCount > 0 ? (monthTotalScore / monthLoggedCount).toFixed(1) : '0.0';
            document.getElementById('stat-month-avg').textContent = monthAvg;
        }

        function formatDateKey(year, month, day) {
            const m = String(month + 1).padStart(2, '0');
            const d = String(day).padStart(2, '0');
            return `${year}-${m}-${d}`;
        }

        let toastTimer;
        function triggerToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = text;
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 1800);
        }
    </script>
</body>
</html>
